<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B72"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="favFacet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="favFacet3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="60%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="favFacet4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA8BA"/>
      <stop offset="100%" stop-color="#FF4B72"/>
    </linearGradient>
    <linearGradient id="favFacet5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E63"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 100% Transparent Background (No background box) -->
  <g transform="translate(14, 14) scale(0.35)" filter="url(#favGlow)">
    <!-- Left Column Left Plane -->
    <polygon points="0,290 0,70 70,0 70,220" fill="url(#favFacet1)" />
    <!-- Left Column Shadow Crease -->
    <polygon points="70,0 70,220 120,290 120,70" fill="url(#favFacet2)" />
    
    <!-- Diagonal Bridge Front -->
    <polygon points="70,0 215,220 145,290 0,70" fill="url(#favFacet3)" opacity="0.95" />
    <!-- Diagonal Inner Fold Highlight -->
    <polygon points="70,0 145,290 120,290 70,220" fill="url(#favFacet4)" opacity="0.5" />
    
    <!-- Right Column Front -->
    <polygon points="215,70 215,290 285,220 285,0" fill="url(#favFacet5)" />
    <!-- Right Column Shadow Side -->
    <polygon points="145,0 215,70 215,290 145,220" fill="url(#favFacet2)" />

    <!-- Broadcast Signal Dot & Pulse -->
    <circle cx="285" cy="0" r="14" fill="#FF2E63" />
    <path d="M265, -8 Q285,-22 305,-8" fill="none" stroke="#FF5E82" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
